name: 'Tests'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            kind: pip
            python: '3.14'
          - os: windows-latest
            kind: pip
            python: '3.12'
          - os: macos-latest
            kind: conda
            python: '3.11'  # MNE-Python's minimum
    env:
      CI_OS_NAME: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
        if: ${{ matrix.kind == 'pip' }}
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          create-args: python=${{ matrix.python }}
        if: ${{ matrix.kind == 'conda' }}
      - run: git clone --single-branch -b main https://github.com/mne-tools/mne-python.git
        name: Clone MNE-Python
      - name: Setup minimal commands
        uses: mne-tools/mne-tools/actions/setup-minimal-commands@main
      - run: neuromag2ft --version
        name: Check neuromag2ft
        if: ${{ startswith(matrix.os, 'ubuntu') }}
      - run: |
          wget -q https://github.com/sccn/liblsl/releases/download/v1.16.2/liblsl-1.16.2-jammy_amd64.deb
          sudo apt install ./liblsl-*.deb
        if: ${{ startswith(matrix.os, 'ubuntu') }}
        name: Install liblsl
      - run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt -ve . -e ./mne-python
        name: Install dependencies and MNE-Realtime
      - run: mne sys_info
      - run: ./tools/get_testing_version.sh
        working-directory: ./mne-python
      - run: python -c "import mne; print(mne.datasets.testing.data_path(verbose=True))"
        name: Get test data
      - uses: actions/cache@v6
        with:
          key: ${{ env.TESTING_VERSION }}
          path: ~/mne_data
      - run: pytest -vv mne_realtime
      - uses: codecov/codecov-action@v7
        if: success() || failure()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
